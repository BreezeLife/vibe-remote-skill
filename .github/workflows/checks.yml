name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate neutral configuration
        run: python3 skills/vibe-remote/scripts/vibe_remote.py validate skills/vibe-remote/assets/config.default.json

  native:
    name: macOS native app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native protocol and draft tests
        run: swift test --package-path apps/macos --disable-sandbox
      - name: Command Line Tools compatible core tests
        run: bash scripts/test_macos_core.sh
      - name: Speech PCM and session checks
        run: bash scripts/test_macos_speech.sh
      - name: Voice-key integration regressions
        run: bash scripts/test_macos_model.sh
      - name: Device input lifecycle checks
        run: bash scripts/test_macos_hid.sh
      - name: Guarded tool adapter checks
        run: bash scripts/test_macos_tools.sh
      - name: Native settings persistence checks
        run: bash scripts/test_macos_controls.sh
      - name: Native controls integration checks
        run: bash scripts/test_macos_integration.sh
      - name: Build and verify app bundle
        env:
          VIBE_OUTPUT_DIR: ${{ runner.temp }}/vibe-remote-build
        run: bash scripts/build_macos_app.sh
      - name: Build and verify current-user installer
        env:
          VIBE_PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/vibe-remote-installer
        run: bash scripts/package_macos_app.sh
