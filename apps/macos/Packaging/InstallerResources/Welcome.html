<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>安装 Vibe Remote</title></head>
<body>
<h1>Vibe Remote</h1>
<p>通过蓝牙接收小米遥控器音频，转写为可审阅的草稿；配置按键并绑定 Codex、Claude、WorkBuddy 等桌面工具。</p>
<p>安装位置：系统「应用程序」目录 <b>/Applications/Vibe Remote.app</b>，供本机用户使用。
安装时 macOS 会要求管理员授权。</p>
<p>安装前，请复制需要保留的草稿并退出 Vibe Remote。草稿仅在内存中，退出后不会保留。</p>
<p>此开发预览版尚未进行 Developer ID 签名或 Apple 公证。
本安装包不安装驱动、不修改系统音频设备，也不自动授予隐私权限。</p>
</body></html>
