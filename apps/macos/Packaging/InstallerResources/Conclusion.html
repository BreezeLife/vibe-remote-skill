<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>开始使用 Vibe Remote</title></head>
<body>
<h1>安装完成</h1>
<p>打开主目录中的 <b>Applications → Vibe Remote</b>。</p>
<ol>
<li>确认其他遥控器桥接应用已退出，点击「连接遥控器」。</li>
<li>点击「启用语音识别」，按系统提示授权。</li>
<li>按住语音键说话，松开后检查草稿；可显式复制到目标应用。</li>
<li>在「按键」学习实体键，在「连接与权限」验证独占效果后启用映射。</li>
<li>在「编程工具」学习输入框、会话及发送/停止控件。逐项验证后插入草稿并预览发送。</li>
</ol>
<p>默认使用本机语音识别。若所选语言不可用，应用会显示原因；
只有明确勾选「允许 Apple 在线识别」，音频才允许交给 Apple 语音服务。</p>
</body></html>
